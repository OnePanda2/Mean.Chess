# Every push to main is checked and, if everything passes, published to GitHub Pages.
# Pull requests run the same checks without deploying. See docs/DEPLOYMENT.md.
name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes the enforced engine coverage thresholds (vitest.config.ts).
      - run: npm run test:coverage
      # The game server against a real local runtime (wrangler dev): integration tests, and proof that
      # the pinned Wrangler supports our compatibility date (A0 spike rule).
      - run: npm run test:server
      # Online play end to end: two browsers against the real game server (ONLINE-TEST-PLAN.md §6).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; never cancel one that is under way.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The game server's private staging Worker (meanchess-online-staging.onepanda2.workers.dev).
  # Production stays manual until the dark launch (LAUNCH-PLAN.md A9) and the founder's approval.
  deploy-online-staging:
    name: Deploy game server (staging)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: online-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A Worker's first deploy can fail right after its upload: Cloudflare's follow-up call doesn't see the
      # brand-new Worker yet (code 10007). Seen on 28 October 2026; one retry after a pause is enough.
      - run: npx wrangler deploy -c server/wrangler.jsonc --env staging || (sleep 20 && npx wrangler deploy -c server/wrangler.jsonc --env staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
