<!doctype html>
<html lang="en" data-theme="mean">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta
      name="description"
      content="Play Mean Chess online with a friend: create a game, send the link, play. No account needed."
    />
    <title>Play online · Mean Chess</title>
    <link rel="canonical" href="https://meanchess.siddheshthapa.com/online/" />
    <!-- Link previews (Open Graph, X/Twitter). The image is the press kit's (public/press/). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mean Chess" />
    <meta property="og:title" content="You've been challenged to Mean Chess" />
    <meta property="og:description" content="A friend wants a game of Mean Chess: chess, but kings kill kings. Open the link to play, no account needed." />
    <meta property="og:url" content="https://meanchess.siddheshthapa.com/online/" />
    <meta property="og:image" content="https://meanchess.siddheshthapa.com/press/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Mean Chess board: the white king slices its own pawn in half to capture the black king." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint (src/app/appearance.ts owns the format).
      try {
        var saved = JSON.parse(localStorage.getItem('mean-chess:appearance:v1') || '{}').theme
        if (['mean', 'sugar', 'arcade', 'picnic'].indexOf(saved) >= 0) document.documentElement.dataset.theme = saved
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/online-page.tsx"></script>
  </body>
</html>
