<!doctype html>
<html lang="en" data-theme="mean">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta
      name="description"
      content="Play Mean Chess against the computer or a friend: chess, but kings hunt each other and a desperate king may eat his own army."
    />
    <title>Play · Mean Chess</title>
    <script>
      // Apply the saved theme before first paint (src/app/appearance.ts owns the format).
      try {
        var saved = JSON.parse(localStorage.getItem('mean-chess:appearance:v1') || '{}').theme
        if (['mean', 'sugar', 'arcade', 'picnic'].indexOf(saved) >= 0) document.documentElement.dataset.theme = saved
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/play.tsx"></script>
  </body>
</html>
